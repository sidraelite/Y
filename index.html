<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YEDC Nexus Pro</title>
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <style>
        :root { --case: #cbd5e1; --lcd: #9db04a; --btn: #1e293b; --green: #10b981; --red: #ef4444; --yellow: #f59e0b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: #000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100dvh; overflow: hidden; font-family: sans-serif; }
        
        .monitor-box { width: 95%; max-width: 380px; height: 92dvh; background: var(--case); padding: 20px; border-radius: 35px; border-bottom: 12px solid #475569; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        
        .led-panel { position: absolute; top: 20px; right: 35px; display: flex; gap: 15px; }
        .led-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .led { width: 10px; height: 10px; border-radius: 50%; background: #4b5563; border: 1px solid rgba(0,0,0,0.2); }
        .led.rate.on { background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1s infinite; }
        .led.comm.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .led.tamper.on { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
        .led-label { font-size: 7px; font-weight: 900; color: #475569; letter-spacing: 0.5px; }

        .lcd { background: var(--lcd); height: 22%; border: 6px solid #111; border-radius: 12px; padding: 15px; box-shadow: inset 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .sig { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
        .bar { width: 4px; background: rgba(0,0,0,0.1); } .bar.on { background: #111; }
        .lcd-val { font-family: 'Digital-7 Mono', sans-serif; font-size: 52px; text-align: right; color: #111; margin-top: auto; line-height: 0.9; }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: 42%; }
        .key { background: var(--btn); color: white; border: none; border-radius: 18px; font-size: 26px; font-weight: bold; box-shadow: 0 6px #000; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.05s; }
        .key:active { transform: translateY(4px); box-shadow: 0 2px #000; }
        
        .vend-box { background: #0f172a; padding: 15px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; height: 28%; justify-content: center; }
        .amt-in { width: 100%; height: 45px; border-radius: 12px; border: none; text-align: center; font-weight: 900; font-size: 20px; background: #fff; color: #000; }
        .btn-buy { width: 100%; height: 55px; background: linear-gradient(135deg, var(--yellow), #d97706); border: none; border-radius: 15px; font-weight: 900; cursor: pointer; color: #000; text-transform: uppercase; font-size: 14px; box-shadow: 0 4px 0 #92400e; }
        .btn-buy:active { transform: translateY(2px); box-shadow: 0 2px 0 #92400e; }

        #r_modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        @keyframes pulse { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<div class="monitor-box">
    <div class="led-panel">
        <div class="led-group"><div class="led rate on"></div><div class="led-label">RATE</div></div>
        <div class="led-group"><div class="led comm" id="l_comm"></div><div class="led-label">COMM</div></div>
        <div class="led-group"><div class="led tamper" id="l_tamp"></div><div class="led-label">TAMP</div></div>
    </div>

    <div class="lcd">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="sig"><div class="bar on" style="height:4px"></div><div class="bar on" style="height:7px"></div><div class="bar on" style="height:10px"></div><div class="bar on" style="height:14px"></div></div>
            <div id="msg" style="font-size: 12px; font-weight: 900; color: #111;">NEXUS PRO v60</div>
        </div>
        <div id="val" class="lcd-val">0.00</div>
    </div>

    <div class="keypad">
        <button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button>
        <button class="key" onclick="k('4')">4</button><button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button>
        <button class="key" onclick="k('7')">7</button><button class="key" onclick="k('8')">8</button><button class="key" onclick="k('9')">9</button>
        <button class="key" style="background:var(--red)" onclick="c()">C</button>
        <button class="key" onclick="k('0')">0</button>
        <button class="key" style="background:var(--green)" onclick="e()">↵</button>
    </div>

    <div class="vend-box">
        <input type="number" id="m_id" class="amt-in" placeholder="ENTER METER ID" readonly onclick="this.removeAttribute('readonly');">
        <input type="number" id="amt" class="amt-in" placeholder="₦ AMOUNT">
        <button class="btn-buy" id="b_btn" onclick="validate()">VERIFY PREPAID</button>
    </div>
</div>

<div id="r_modal">
    <canvas id="r_canvas" width="400" height="550" style="max-width:100%; border-radius:15px;"></canvas>
    <button class="key" style="width:200px; height:55px; margin-top:25px; background:var(--yellow); color:#000;" onclick="location.reload()">DISMISS</button>
</div>

<script>
    let buf = ""; let vMeter = "";
    const API = "https://script.google.com/macros/s/AKfycbzcJAPkfV-pQc5-zbM2KTu3gTd0_XPZo8wnCbCLJi9fPenCC356-qWeWaezwalUsuH90w/exec"; 
    const FLW_PUB = "FLWPUBK-47098768922c25b6e34c840ba2c82913-X"; 
    const beep = new Audio('https://www.soundjay.com/buttons/beep-07a.mp3');

    function playBeep() { beep.currentTime = 0; beep.play().catch(()=>{}); }
    
    function k(v) { playBeep(); buf += v; document.getElementById('val').innerText = buf; }
    
    function c() { 
        playBeep(); buf = ""; 
        document.getElementById('val').innerText = "0.00"; 
        document.getElementById('msg').innerText = "SYSTEM READY"; 
        document.getElementById('l_tamp').classList.remove('on'); 
    }

    async function e() {
        if(!buf) return; playBeep(); setComm(true);
        const m = document.getElementById('m_id').value || "0000000000";
        try {
            const r = await fetch(`${API}?meter=${m}&code=${buf}`);
            const d = await r.json();
            document.getElementById('val').innerText = d.val || "0.00";
            document.getElementById('msg').innerText = d.msg;
        } catch(err) { document.getElementById('msg').innerText = "LINK ERROR"; }
        setComm(false); buf = "";
    }

    async function validate() {
        const m = document.getElementById('m_id').value;
        if(!m || m.length < 10) { document.getElementById('l_tamp').classList.add('on'); return; }
        setComm(true); document.getElementById('msg').innerText = "GRID SYNCING...";
        try {
            const r = await fetch(`${API}?meter=${m}&lookup=true`);
            const d = await r.json();
            if(d.status === "success") {
                vMeter = m; 
                document.getElementById('msg').innerText = d.name.toUpperCase();
                document.getElementById('val').innerText = "PASS";
                document.getElementById('b_btn').innerText = "PURCHASE ENERGY";
                document.getElementById('b_btn').onclick = pay;
            } else {
                document.getElementById('msg').innerText = "INVALID METER";
                document.getElementById('l_tamp').classList.add('on');
            }
        } catch(err) { document.getElementById('msg').innerText = "OFFLINE"; }
        setComm(false);
    }

    function pay() {
        const amt = document.getElementById('amt').value;
        if(!amt || amt < 500) { alert("Minimum ₦500"); return; }
        const total = parseInt(amt) + 100; // ₦100 REVENUE
        FlutterwaveCheckout({
            public_key: FLW_PUB,
            tx_ref: "NX_" + Date.now(),
            amount: total,
            currency: "NGN",
            customer: { email: "billing@yedcnexus.com" },
            callback: function(res) { finalize(res.transaction_id, amt); }
        });
    }

    async function finalize(ref, amt) {
        setComm(true); document.getElementById('msg').innerText = "COMMITTING...";
        try {
            const r = await fetch(`${API}?verify_ref=${ref}&amt=${amt}&meter=${vMeter}`);
            const d = await r.json();
            if(d.status === "success") { 
                document.getElementById('val').innerText = "LOAD"; 
                document.getElementById('msg').innerText = "TOKEN GENERATED";
                drawR(d);
            }
        } catch(err) { document.getElementById('msg').innerText = "VEND FAILED"; }
        setComm(false);
    }

    function setComm(on) { document.getElementById('l_comm').classList.toggle('on', on); }

    function drawR(d) {
        const cv = document.getElementById('r_canvas'); const x = cv.getContext('2d');
        x.fillStyle = "#fff"; x.fillRect(0,0,400,550);
        x.fillStyle = "#1e293b"; x.fillRect(0,0,400,80);
        x.fillStyle = "#fff"; x.font = "bold 24px Arial"; x.fillText("YEDC PREPAID RECEIPT", 60, 50);
        x.fillStyle = "#000"; x.font = "16px monospace";
        x.fillText("DATE:    " + d.date, 40, 130);
        x.fillText("METER:   " + d.meter, 40, 160);
        x.fillText("AMOUNT:  " + d.amount, 40, 190);
        x.fillText("UNITS:   " + d.units, 40, 220);
        x.fillRect(40, 260, 320, 2);
        x.font = "bold 18px Arial"; x.fillText("RECHARGE TOKEN", 115, 300);
        x.fillStyle = "#f8fafc"; x.fillRect(30, 320, 340, 100);
        x.fillStyle = "#1e293b"; x.font = "bold 28px Courier"; x.fillText(d.token, 45, 380);
        x.fillStyle = "#64748b"; x.font = "italic 14px Arial"; x.fillText("Thank you for using Nexus Pro", 100, 480);
        document.getElementById('r_modal').style.display = 'flex';
    }
</script>
</body>
</html>
